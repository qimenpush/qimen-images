<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阴盘奇门 · 起局</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #1e1e1e; font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 32px; }
  h1 { text-align: center; font-size: 26px; font-weight: 400; letter-spacing: .35em; text-indent: .35em; margin: 8px 0 28px; }
  .qlabel { font-size: 23px; color: #8c8c8c; font-family: "Noto Serif SC", "Songti SC", serif; margin-bottom: 6px; }
  #q { width: 100%; border: none; border-bottom: 2px solid #cdcdcd; outline: none; font-size: 28px; font-family: "Noto Serif SC", "Songti SC", serif; padding: 6px 0 10px; background: transparent; }
  #q:disabled { color: #5f5f5f; border-bottom-color: #e0e0e0; }
  .sizhu { display: flex; gap: 10px; margin-top: 22px; }
  .pillar { text-align: center; }
  .chip { background: #ebebeb; border-radius: 4px; font-size: 13px; color: #828282; padding: 2px 0; width: 36px; margin: 0 auto; }
  .gan, .zhi { font-size: 24px; font-family: "Noto Serif SC", "Songti SC", serif; line-height: 1.35; }
  table.grid { width: 100%; border-collapse: collapse; border: 4px solid #1e1e1e; margin-top: 18px; table-layout: fixed; }
  td.cell { border: 3px solid #1e1e1e; aspect-ratio: 1; position: relative; background: #fff; overflow: hidden; }
  .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
  .god, .star, .door, .cgan { position: absolute; left: 50%; transform: translate(-50%, -50%); font-size: clamp(20px, 5.5vw, 30px); }
  .god { top: 24%; } .star { top: 48%; } .door { top: 71%; }
  .tian, .di { position: absolute; transform: translateY(-50%); font-size: clamp(17px, 4.8vw, 26px); left: calc(50% + 1.5em); }
  .tian { top: 48%; } .di { top: 71%; }
  .yin { position: absolute; left: 7px; top: 6px; font-size: clamp(17px, 4.8vw, 26px); }
  .gong { position: absolute; left: 7px; bottom: 8px; font-size: 18px; color: #828282; font-family: "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; }
  .zhong { position: absolute; left: 7px; bottom: 8px; font-size: 14px; color: #828282; }
  .cgan { top: 42%; }
  .gen { color: #bebebe !important; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .bar { border: 1px solid #1e1e1e; border-radius: 10px; padding: 14px 8px; text-align: center; font-size: 19px; margin-top: 22px; min-height: 52px; }
  .bar.warn { color: #b22c22; }
  .btn { background: #b22c22; color: #fff; border-radius: 38px; padding: 18px 0; text-align: center; font-size: 28px; margin: 46px auto 0; width: 300px; max-width: 100%; cursor: pointer; user-select: none; }
  .btn:active { opacity: .85; }
  .reset { text-align: center; color: #8c8c8c; font-size: 16px; margin-top: 18px; cursor: pointer; display: none; }
  .footer { text-align: center; color: #6e6e6e; font-size: 16px; line-height: 1.9; margin-top: 56px; }
  .footer .note { font-size: 13px; color: #a0a0a0; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>阴盘奇门</h1>
  <div class="qlabel">写下你要问的事</div>
  <input id="q" type="text" placeholder="例如：今年该不该换工作" autocomplete="off">
  <div class="sizhu" id="sizhu"></div>
  <table class="grid" id="grid"></table>
  <div class="bar" id="bar">第一步 生成八神</div>
  <div class="btn" id="btn">起 一 层</div>
  <div class="reset" id="reset">再起一局</div>
  <div class="footer">
    <div>2026-10-22 21:00 星期四</div>
    <div>二〇二六年 九月十三 亥时</div>
    <div class="note">演示版：盘面固定为 2026-10-22 21:00，起局码时间与盘面一致；正式版接实时排盘引擎。</div>
  </div>
</div>
<script>
var WX = { wood: '#009000', fire: '#D60000', earth: '#8B4513', metal: '#D6A000', water: '#0000CC' };
var WXM = { '甲':'wood','乙':'wood','寅':'wood','卯':'wood','伤':'wood','杜':'wood','冲':'wood','辅':'wood','合':'wood','符':'wood',
  '丙':'fire','丁':'fire','巳':'fire','午':'fire','景':'fire','英':'fire','蛇':'fire',
  '戊':'earth','己':'earth','辰':'earth','戌':'earth','丑':'earth','未':'earth','死':'earth','生':'earth','禽':'earth','芮':'earth','任':'earth','地':'earth',
  '庚':'metal','辛':'metal','申':'metal','酉':'metal','惊':'metal','开':'metal','柱':'metal','心':'metal','天':'metal','阴':'metal','虎':'metal',
  '壬':'water','癸':'water','亥':'water','子':'water','休':'water','蓬':'water','武':'water' };
function wxColor(txt) {
  if (!txt) return WX.earth;
  var k;
  if (txt.length > 1) {
    if (txt.indexOf('门') >= 0) k = txt[0];
    else if (txt.indexOf('天') >= 0) k = txt[1];
    else k = txt[1];
  } else k = txt;
  return WX[WXM[k] || 'earth'];
}
var PLATE = {
  '巽': { god: '白虎', star: '天心', door: '景门', tian: '乙', di: '己', tri: '☴' },
  '离': { god: '六合', star: '天蓬', door: '死门', tian: '壬', di: '癸', tri: '☲' },
  '坤': { god: '太阴', star: '天任', door: '惊门', tian: '丁', di: '辛', tri: '☷' },
  '震': { god: '玄武', star: '天柱', door: '杜门', tian: '丙', di: '庚', tri: '☳' },
  '兑': { god: '螣蛇', star: '天冲', door: '开门', tian: '庚', di: '丙', tri: '☱' },
  '艮': { god: '九地', star: '禽芮', door: '伤门', tian: '辛', di: '丁', tri: '☶' },
  '坎': { god: '九天', star: '天英', door: '生门', tian: '癸', di: '壬', tri: '☵' },
  '乾': { god: '值符', star: '天辅', door: '休门', tian: '己', di: '乙', tri: '☰' }
};
var ORDER = ['巽', '离', '坤', '震', null, '兑', '艮', '坎', '乾'];
var PILLARS = [['年', '丙', '午'], ['月', '戊', '戌'], ['日', '己', '巳'], ['时', '乙', '亥']];
var LAYERS = [
  { name: '八神', key: 'shen' }, { name: '九星', key: 'xing' }, { name: '八门', key: 'men' },
  { name: '天盘干', key: 'tian' }, { name: '地盘干', key: 'di' }, { name: '宫位符号和引干', key: 'gongyin' }
];
var NUM = ['一', '二', '三', '四', '五', '六'];
var TS = '202610222100';
var cur = 0, phase = 'ready', yao = [], locked = false, code = '';

var sizhuEl = document.getElementById('sizhu');
PILLARS.forEach(function (p) {
  var d = document.createElement('div');
  d.className = 'pillar';
  d.innerHTML = '<div class="chip">' + p[0] + '</div>' +
    '<div class="gan serif" style="color:' + wxColor(p[1]) + '">' + p[1] + '</div>' +
    '<div class="zhi serif" style="color:' + wxColor(p[2]) + '">' + p[2] + '</div>';
  sizhuEl.appendChild(d);
});

var gridEl = document.getElementById('grid');
var cells = {};
for (var r = 0; r < 3; r++) {
  var tr = document.createElement('tr');
  for (var c = 0; c < 3; c++) {
    var name = ORDER[r * 3 + c];
    var td = document.createElement('td');
    td.className = 'cell';
    if (name) {
      td.innerHTML = '<span class="god serif"></span><span class="star serif"></span>' +
        '<span class="tian serif"></span><span class="door serif"></span><span class="di serif"></span>' +
        '<span class="yin serif"></span><span class="gong"></span>';
      cells[name] = td;
    } else {
      td.innerHTML = '<span class="cgan serif"></span><span class="zhong"></span>';
      cells['中'] = td;
    }
    tr.appendChild(td);
  }
  gridEl.appendChild(tr);
}
function span(cell, cls) { return cell.querySelector('.' + cls); }
function fillLayer(key, mode) {
  Object.keys(PLATE).forEach(function (name) {
    var p = PLATE[name], td = cells[name];
    if (key === 'shen') setSpan(span(td, 'god'), p.god, mode);
    if (key === 'xing') setSpan(span(td, 'star'), p.star, mode);
    if (key === 'men') setSpan(span(td, 'door'), p.door, mode);
    if (key === 'tian') setSpan(span(td, 'tian'), p.tian, mode);
    if (key === 'di') setSpan(span(td, 'di'), p.di, mode);
    if (key === 'gongyin') {
      setSpan(span(td, 'yin'), p.tian, mode);
      var g = span(td, 'gong'); g.textContent = p.tri;
    }
  });
  if (key === 'di') setSpan(span(cells['中'], 'cgan'), '戊', mode);
  if (key === 'gongyin') span(cells['中'], 'zhong').textContent = '中';
}
function setSpan(el, txt, mode) {
  el.textContent = txt;
  if (mode === 'gen') { el.classList.add('gen'); el.style.color = ''; }
  else { el.classList.remove('gen'); el.style.color = wxColor(txt); }
}
function drawYao() {
  var r = Math.random() * 8;
  return r < 1 ? 6 : r < 4 ? 7 : r < 7 ? 8 : 9;
}
function makeCode() {
  var s = TS + yao.join('');
  var sum = 0;
  for (var i = 0; i < s.length; i++) sum += parseInt(s[i], 10);
  return 'QM1-' + TS + '-' + yao.join('') + '-' + String.fromCharCode(65 + (sum % 26));
}
var barEl = document.getElementById('bar');
var btnEl = document.getElementById('btn');
var qEl = document.getElementById('q');
var resetEl = document.getElementById('reset');
function setBar(t, warn) {
  barEl.textContent = t;
  barEl.classList.toggle('warn', !!warn);
}
function remind() {
  setBar('请先写下你要问的事', true);
  setTimeout(function () {
    if (phase === 'ready' && cur < 6) setBar('第' + NUM[cur] + '步 生成' + LAYERS[cur].name);
    else if (cur >= 6) setBar(code);
    barEl.classList.remove('warn');
  }, 2000);
}
btnEl.addEventListener('click', function () {
  if (phase === 'done') { copyCode(); return; }
  if (phase === 'ready') {
    if (!qEl.value.trim()) { remind(); return; }
    if (!locked) { locked = true; qEl.disabled = true; }
    phase = 'generating';
    setBar('正在生成' + LAYERS[cur].name);
    btnEl.textContent = '停 止';
    fillLayer(LAYERS[cur].key, 'gen');
  } else if (phase === 'generating') {
    phase = 'ready';
    fillLayer(LAYERS[cur].key, 'settle');
    yao.push(drawYao());
    cur++;
    if (cur < 6) {
      setBar('第' + NUM[cur] + '步 生成' + LAYERS[cur].name);
      btnEl.textContent = '起 一 层';
    } else {
      code = makeCode();
      phase = 'done';
      setBar(code);
      btnEl.textContent = '复制起局码';
      resetEl.style.display = 'block';
    }
  }
});
function copyCode() {
  function ok() {
    var old = btnEl.textContent;
    btnEl.textContent = '已复制';
    setTimeout(function () { btnEl.textContent = old; }, 2000);
  }
  function fail() {
    setBar('复制失败，请手动长按复制码', true);
    setTimeout(function () { setBar(code); barEl.classList.remove('warn'); }, 2500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(ok).catch(fail);
  } else {
    var ta = document.createElement('textarea');
    ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(); }
    document.body.removeChild(ta);
  }
}
resetEl.addEventListener('click', function () {
  cur = 0; phase = 'ready'; yao = []; locked = false; code = '';
  qEl.disabled = false;
  document.querySelectorAll('#grid span').forEach(function (s) {
    s.textContent = ''; s.classList.remove('gen'); s.style.color = '';
  });
  setBar('第一步 生成八神');
  btnEl.textContent = '起 一 层';
  resetEl.style.display = 'none';
});
</script>
</body>
</html>
